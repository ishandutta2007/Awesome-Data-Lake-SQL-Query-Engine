<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Dynamic / Animated Neon Orbs in Background -->
  <g opacity="0.55">
    <circle cx="180" cy="90" r="130" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="cx" values="180;230;180" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.6;0.35" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="270" r="140" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="cx" values="1020;970;1020" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.55;0.3" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="180" r="110" fill="#6366f1" filter="url(#glow)">
      <animate attributeName="cy" values="180;210;180" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated Data Flow Line in Background -->
  <g opacity="0.25">
    <path d="M-100,280 C200,340 400,160 700,240 C1000,320 1100,180 1300,260" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="10 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground Content: Titles & Subtitle -->
  <g id="foreground-content">
    <!-- Tagline Badge -->
    <g transform="translate(440, 48)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="20" cy="16" r="5" fill="#38bdf8">
        <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">LAKEHOUSE &amp; ANALYTICS ENGINE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Data Lake <tspan fill="url(#accentGrad)">SQL Query Engines</tspan>
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Landscape of Distributed Query Engines, Cloud Warehouses &amp; Lakehouse Technologies
    </text>

    <!-- Pill Badges -->
    <g transform="translate(230, 240)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="135" height="38" rx="19" fill="url(#pillGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
        <text x="67" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Trino &amp; Presto</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="135" height="38" rx="19" fill="url(#pillGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1"/>
        <text x="67" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🦆 DuckDB &amp; OLAP</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(300, 0)">
        <rect width="145" height="38" rx="19" fill="url(#pillGrad)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
        <text x="72" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔥 Spark &amp; BigQuery</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(460, 0)">
        <rect width="140" height="38" rx="19" fill="url(#pillGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
        <text x="70" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">❄️ Snowflake &amp; Iceberg</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(615, 0)">
        <rect width="125" height="38" rx="19" fill="url(#pillGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1"/>
        <text x="62" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 ClickHouse</text>
      </g>
    </g>

    <!-- Bottom Metrics Strip -->
    <g transform="translate(350, 315)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">✓ 100% Open &amp; Vendor Neutral</text>
      <text x="210" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">✓ Interactive SQL Analytics</text>
      <text x="410" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">✓ Real-Time &amp; Federated Benchmarks</text>
    </g>
  </g>
</svg>